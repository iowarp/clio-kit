# Codecov configuration for CLIO Kit monorepo
# Handles coverage from multiple independent MCP server packages

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
        flags:
          - adios
          - arxiv
          - chronolog
          - compression
          - darshan
          - hdf5
          - jarvis
          - lmod
          - ndp
          - node-hardware
          - pandas
          - parallel-sort
          - paraview
          - parquet
          - plot
          - slurm
          - spack
    patch:
      default:
        target: auto
        threshold: 0%

# Flag configuration for each MCP server
flags:
  adios:
    paths:
      - mcp-servers/adios/
  arxiv:
    paths:
      - mcp-servers/arxiv/
  chronolog:
    paths:
      - mcp-servers/chronolog/
  compression:
    paths:
      - mcp-servers/compression/
  darshan:
    paths:
      - mcp-servers/darshan/
  hdf5:
    paths:
      - mcp-servers/hdf5/
  jarvis:
    paths:
      - mcp-servers/jarvis/
  lmod:
    paths:
      - mcp-servers/lmod/
  ndp:
    paths:
      - mcp-servers/ndp/
  node-hardware:
    paths:
      - mcp-servers/node-hardware/
  pandas:
    paths:
      - mcp-servers/pandas/
  parallel-sort:
    paths:
      - mcp-servers/parallel-sort/
  paraview:
    paths:
      - mcp-servers/paraview/
  parquet:
    paths:
      - mcp-servers/parquet/
  plot:
    paths:
      - mcp-servers/plot/
  slurm:
    paths:
      - mcp-servers/slurm/
  spack:
    paths:
      - mcp-servers/spack/

# Comment configuration
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore patterns
ignore:
  - "**/__pycache__"
  - "**/tests/"
  - "**/.venv"
  - "**/htmlcov"
  - "clio-kit-website/"
