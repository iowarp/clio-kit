[project]
name = "slicer-mcp"
version = "1.0.0"
description = "Slice 3D models (STL, 3MF, STEP) with the PrusaSlicer or OrcaSlicer installed here, and see the toolpaths layer by layer."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "3D printing", "slicer", "G-code", "PrusaSlicer", "OrcaSlicer", "toolpaths"]
dependencies = [
    "fastmcp>=4.1.2,<5",
    "platformdirs>=4.3",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
slicer-mcp = "slicer_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slicer_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slicer: needs PrusaSlicer installed; skipped with a typed reason when none is found",
]

[tool.mypy]
ignore_missing_imports = true
