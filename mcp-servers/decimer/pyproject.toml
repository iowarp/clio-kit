[project]
name = "decimer-mcp"
version = "1.0.0"
description = "Read a chemical structure drawing (PNG, JPEG) into SMILES with the DECIMER image-to-SMILES model, checked with RDKit."
readme = "README.md"
# TensorFlow 2.20 CPU wheels are what DECIMER 2.8 runs on; this server pins 3.11-3.12.
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "chemistry", "OCSR", "DECIMER", "SMILES", "RDKit", "image"]
dependencies = [
    "fastmcp>=4.1.2,<5",
    "platformdirs>=4.3",
    "decimer==2.8.1",
    # CPU-only TensorFlow on Linux (no CUDA libraries); the regular wheel elsewhere.
    "tensorflow-cpu==2.20.0; sys_platform == 'linux'",
    "tensorflow==2.20.0; sys_platform != 'linux'",
    "rdkit>=2024.9.1",
    "pillow>=10.4",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
decimer-mcp = "decimer_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[tool.uv]
# DECIMER asks for `tensorflow`; on Linux the CPU-only `tensorflow-cpu` wheel provides
# the same `tensorflow` module without the GPU build, so the requirement is dropped there.
override-dependencies = ["tensorflow==2.20.0; sys_platform != 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decimer_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: loads the DECIMER model (downloads its weights on first use); skipped when unavailable",
]
