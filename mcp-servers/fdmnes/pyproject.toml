[project]
name = "fdmnes-mcp"
version = "1.0.0"
description = "X-ray absorption near-edge spectra (XANES) of crystals and molecules with FDMNES: run, normalize and compare spectra."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "chemistry", "XANES", "XAS", "FDMNES", "spectroscopy"]
dependencies = [
    "fastmcp>=4.1.2,<5",
    "ase>=3.25",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
fdmnes-mcp = "fdmnes_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdmnes_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: runs the real FDMNES executable; skipped when it is not found",
]
