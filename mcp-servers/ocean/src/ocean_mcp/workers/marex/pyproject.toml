# Worker environment for marEx (AGPL-3.0-or-later). The ocean server never imports
# marEx; it runs worker.py in this separate environment as a subprocess.
[project]
name = "ocean-marex-worker"
version = "1.0.0"
description = "Runs marEx marine-extreme detection and tracking for the ocean MCP server"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
dependencies = ["marEx==5.0.0", "netCDF4>=1.7", "xarray>=2025.1"]

[tool.uv]
package = false
