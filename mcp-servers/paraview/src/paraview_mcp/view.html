<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ParaView view</title>
<style>
  /* Fallbacks for a host that sends no style variables (MCP Apps theming). */
  :root {
    color-scheme: light dark;
    --color-background-primary: light-dark(#f7f7f5, #1e1f22);
    --color-text-primary: light-dark(#1f2328, #e6e8eb);
    --color-border-primary: light-dark(#d4d6da, #3a3d44);
    --font-sans: system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; font: 13px var(--font-sans); }
  body { display: flex; flex-direction: column; min-height: 520px;
    background: var(--color-background-primary); color: var(--color-text-primary); }
  #status { padding: 6px 10px; border-bottom: 1px solid var(--color-border-primary); }
  #status[hidden] { display: none; }
  #status button { font: inherit; margin-left: 8px; }
  #frame { flex: 1; width: 100%; border: 0; min-height: 480px; }
  #frame[hidden] { display: none; }
</style>
</head>
<body>
<div id="status" role="status">Opening the ParaView view…</div>
<iframe id="frame" title="ParaView" hidden></iframe>
<script>
(() => {
  'use strict';
  const PROTOCOL = '2026-01-26';
  const SERVICE_KEY = 'ai.iowarp.clio/service';
  const statusBox = document.getElementById('status');
  const frame = document.getElementById('frame');
  const pending = new Map();
  let nextId = 1;
  let serviceUrl = null;
  let hostContext = {};
  let latest = null;
  let lastSent = 0;
  let sendTimer = null;
  let sentText = '';
  let opened = null;

  function send(message) { window.parent.postMessage(message, '*'); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: '2.0', id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: '2.0', method, params }); }
  function respond(id, result) { send({ jsonrpc: '2.0', id, result }); }

  function showStatus(text, withReconnect) {
    statusBox.hidden = false;
    statusBox.textContent = text;
    if (withReconnect) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Reconnect';
      button.addEventListener('click', () => loadFrame());
      statusBox.appendChild(button);
    }
  }

  // The view follows the host's theme and style variables, and passes them on to
  // the ParaView page so its panel and render view take the same tone.
  let appliedVariables = [];
  function sendTheme() {
    const theme = hostContext && (hostContext.theme === 'dark' || hostContext.theme === 'light')
      ? hostContext.theme : null;
    const styles = (hostContext && hostContext.styles) || {};
    const variables = styles.variables && typeof styles.variables === 'object' ? styles.variables : {};
    const root = document.documentElement;
    appliedVariables.forEach((name) => { if (!(name in variables)) root.style.removeProperty(name); });
    appliedVariables = [];
    for (const [name, value] of Object.entries(variables)) {
      if (/^--[A-Za-z0-9-]+$/.test(name) && typeof value === 'string') {
        root.style.setProperty(name, value);
        appliedVariables.push(name);
      }
    }
    root.style.colorScheme = theme || 'light dark';
    if (frame.contentWindow) {
      frame.contentWindow.postMessage({ type: 'clio.paraview.theme', theme, variables }, '*');
    }
  }

  function serviceFrom(context) {
    const entry = context && context[SERVICE_KEY];
    return entry && typeof entry.url === 'string' ? entry.url : null;
  }

  function loadFrame() {
    if (!serviceUrl) {
      showStatus('This host did not give the view its ParaView service, so the live view cannot open here. '
        + 'The agent can still show the scene with the capture tool.');
      return;
    }
    const base = new URL(serviceUrl, document.baseURI);
    if (!base.pathname.endsWith('/')) base.pathname += '/';
    // trame connects its WebSocket beside its page, under the same route.
    const page = new URL('index.html', base);
    page.search = base.search;
    statusBox.hidden = true;
    frame.hidden = false;
    frame.src = page.href;
  }

  function describe(state) {
    const parts = [];
    parts.push('ParaView view of ' + (state.dataset || 'scene ' + state.scene) + ' (scene id ' + state.scene + ').');
    const t = state.time || {};
    if (t.steps > 1) {
      let line = 'Time step ' + (t.index + 1) + ' of ' + t.steps + ' (time ' + t.time + ')';
      if (t.follow_latest) line += ', following the latest step.';
      else line += ', parked by the person; ' + t.newer_steps + ' newer step(s) exist, latest time ' + t.latest_time + '.';
      parts.push(line);
    }
    const pipeline = state.pipeline || state.representation || [];
    if (pipeline.length) {
      parts.push('Pipeline: ' + pipeline.map(objectText).join('; ') + '.');
    }
    if (state.active_object) parts.push('Selected in the view\'s panel: ' + state.active_object + '.');
    if (state.selection) {
      const s = state.selection;
      parts.push('The person picked point ' + s.point_id + ' of ' + s.object + ' at (' + (s.point || []).join(', ') + '): '
        + Object.entries(s.values || {}).map(([k, v]) => k + '=' + JSON.stringify(v)).join(', ') + '.');
    }
    if (state.camera) {
      parts.push('Camera position (' + state.camera.position.map((v) => v.toPrecision(4)).join(', ') + '), focal point ('
        + state.camera.focal_point.map((v) => v.toPrecision(4)).join(', ') + '), view up ('
        + (state.camera.view_up || []).map((v) => v.toPrecision(3)).join(', ') + ')'
        + (state.camera.parallel_projection ? ', parallel projection.' : '.'));
    }
    if (state.changes_text && state.changes_text.length) {
      parts.push('Recent changes in the view, oldest first: ' + state.changes_text.join('; ') + '.');
    }
    parts.push(state.view_mode === 'remote'
      ? 'Rendered on the ParaView machine (remote mode).'
      : 'Drawn in the browser from ParaView geometry (local mode).');
    return parts.join(' ');
  }

  function shortValue(v) {
    if (Array.isArray(v)) return '(' + v.map(shortValue).join(', ') + ')';
    return typeof v === 'number' ? String(Number(v.toPrecision(4))) : String(v);
  }

  function objectText(o) {
    let line = o.id + ' ' + (o.label || o.type);
    if (o.input) line += ' (' + o.type + ' on ' + o.input + ')';
    const props = Object.entries(o.properties || {});
    if (props.length) line += ' [' + props.map(([k, v]) => k + ' ' + shortValue(v)).join(', ') + ']';
    if (o.visible === false) return line + ' hidden';
    line += ' shown as ' + o.representation;
    if (o.color_by) {
      line += ' coloured by ' + o.color_by;
      if (o.color_component !== null && o.color_component !== undefined) line += ' component ' + o.color_component;
      if (o.colormap) line += ' (' + o.colormap + ')';
      if (o.scalar_bar) line += ' with a colour legend';
    } else line += ' in solid colour';
    if (o.opacity !== undefined && o.opacity < 1) line += ', opacity ' + shortValue(o.opacity);
    return line;
  }

  function structured(state) {
    const t = state.time || {};
    return {
      scene: state.scene,
      dataset: state.dataset,
      time: t.time === undefined ? null : t.time,
      time_index: t.index === undefined ? null : t.index,
      time_steps: t.steps || 0,
      latest_time: t.latest_time === undefined ? null : t.latest_time,
      newer_steps: t.newer_steps || 0,
      follow_latest: t.follow_latest !== false,
      selection: state.selection,
      representation: state.representation,
      pipeline: state.pipeline || [],
      active_object: state.active_object || null,
      camera: state.camera,
      view_mode: state.view_mode,
      changes: state.changes || [],
    };
  }

  // At most ten context updates a second; the last state wins.
  function report() {
    sendTimer = null;
    if (!latest) return;
    const text = describe(latest);
    if (text === sentText) return;
    sentText = text;
    lastSent = Date.now();
    request('ui/update-model-context', {
      content: [{ type: 'text', text }],
      structuredContent: structured(latest),
    }).catch(() => { sentText = ''; });
  }
  function schedule() {
    if (sendTimer) return;
    const wait = Math.max(0, 100 - (Date.now() - lastSent));
    sendTimer = setTimeout(report, wait);
  }

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (frame.contentWindow && event.source === frame.contentWindow) {
      if (data.type === 'clio.paraview.state' && data.state) {
        latest = data.state;
        schedule();
      } else if (data.type === 'clio.paraview.ready') {
        sendTheme();
      } else if (data.type === 'clio.paraview.link') {
        if (data.up) statusBox.hidden = true;
        else showStatus('Lost the link to ParaView. The scene is kept there; the next ParaView action reconnects it.', true);
      }
      return;
    }
    if (event.source !== window.parent || data.jsonrpc !== '2.0') return;
    if (data.id !== undefined && pending.has(data.id) && !data.method) {
      const entry = pending.get(data.id);
      pending.delete(data.id);
      if (data.error) entry.reject(data.error); else entry.resolve(data.result);
      return;
    }
    switch (data.method) {
      case 'ui/notifications/tool-result': {
        opened = data.params || null;
        if (opened && opened.isError) {
          const text = (opened.content || []).map((c) => c.text || '').join('\n');
          showStatus(text || 'ParaView could not open the view.');
        }
        break;
      }
      case 'ui/notifications/host-context-changed': {
        hostContext = Object.assign({}, hostContext, data.params || {});
        sendTheme();
        const url = serviceFrom(data.params);
        if (url && url !== serviceUrl) { serviceUrl = url; loadFrame(); }
        break;
      }
      case 'ui/resource-teardown':
        respond(data.id, {});
        break;
      default:
        if (data.id !== undefined && data.method) {
          send({ jsonrpc: '2.0', id: data.id, error: { code: -32601, message: 'Method not found' } });
        }
    }
  });

  request('ui/initialize', {
    appInfo: { name: 'paraview-view', version: '3.1.0' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    protocolVersion: PROTOCOL,
  }).then((result) => {
    hostContext = (result && result.hostContext) || {};
    sendTheme();
    notify('ui/notifications/initialized', {});
    notify('ui/notifications/size-changed', { width: document.body.clientWidth, height: 560 });
    serviceUrl = serviceFrom(hostContext);
    loadFrame();
    const modes = hostContext.availableDisplayModes || [];
    if (modes.includes('fullscreen') && hostContext.displayMode !== 'fullscreen') {
      request('ui/request-display-mode', { mode: 'fullscreen' }).catch(() => {});
    }
  }).catch((error) => {
    showStatus('The host did not start the view: ' + ((error && error.message) || 'unknown error') + '.');
  });
})();
</script>
</body>
</html>
