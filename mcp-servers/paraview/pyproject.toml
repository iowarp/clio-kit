[project]
name = "paraview-mcp"
version = "3.0.0"
description = "See and measure 3D scientific data in ParaView, on this machine or over SSH, in a live view."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "ParaView", "trame", "visualization", "scientific", "3D", "SSH"]
dependencies = [
    "fastmcp>=4.1.2,<5",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
paraview-mcp = "paraview_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paraview_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "pvpython: needs a ParaView 6 pvpython; skipped with a typed reason when none is found",
]

[tool.ruff.lint.per-file-ignores]
# ParaView's array-information proxies are not dicts: membership needs .keys().
"src/paraview_mcp/node/*" = ["SIM118"]

[tool.mypy]
ignore_missing_imports = true
