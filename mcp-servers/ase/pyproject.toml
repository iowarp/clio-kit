[project]
name = "ase-mcp"
version = "1.0.0"
description = "Molecular calculations with ASE: SMILES to 3D, energies, optimizations, vibrations, thermochemistry and IR spectra."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "chemistry", "ASE", "xTB", "MACE", "UMA", "NWChem", "ORCA", "thermochemistry", "vibrations"]
dependencies = [
    "fastmcp>=4.1.2,<5",
    "platformdirs>=4.3",
    "filelock>=3.16",
    "ase>=3.25",
    "numpy>=1.26",
    "rdkit>=2024.3.5",
    "pymatgen-core>=2025.10.9",
]

# Calculators that need heavy packages are extras. The clio-kit launcher syncs the
# server without extras; ase_mcp.envs builds one worker environment per extra on
# first use from the uv.lock shipped inside the package.
[project.optional-dependencies]
xtb = ["tblite>=0.4.0"]
mace = ["mace-torch>=0.3.14", "torch>=2.5"]
uma = ["fairchem-core>=2.3.0", "torch>=2.6"]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
ase-mcp = "ase_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[tool.uv]
# MACE pins e3nn 0.4.4; FAIRChem (UMA) needs e3nn >= 0.5.
conflicts = [[{ extra = "mace" }, { extra = "uma" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ase_mcp"]
# Editable (dev) installs import from src/; the force-included project files below
# only matter for the installed wheel.
dev-mode-dirs = ["src"]

# The worker environments are built from the server's own project and lock.
[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "ase_mcp/_project/pyproject.toml"
"uv.lock" = "ase_mcp/_project/uv.lock"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: builds a calculator environment or runs a real calculation (minutes)",
    "integration: needs an external binary, network or token; skipped when unavailable",
]

[tool.mypy]
ignore_missing_imports = true
