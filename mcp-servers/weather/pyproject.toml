[project]
name = "weather-mcp"
version = "1.0.0"
description = "MCP server for weather and climate analysis: ensemble exceedance, threshold events, sections and soundings with CAPE, forecast scores, station verification, blob tracking, climate indices and CMIP6 regional change, each result with a provenance record"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "weather", "climate", "ERA5", "ensemble", "CAPE", "cyclone", "CMIP6", "verification"]

dependencies = [
    "fastmcp>=4.1.2,<5",
    "python-dotenv>=1.2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "xarray>=2025.1",
    "netCDF4>=1.7",
    "h5netcdf>=1.4",
    "metpy==1.7.1",
    "cfgrib>=0.9.15",
    "eccodes>=2.40",
    "ecmwf-opendata==0.3.35",
    "zarr>=3",
    "gcsfs>=2025.1",
    "intake-esm==2025.12.12",
    "authlib>=1.6.12",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "msgpack>=1.2.1",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
weather-mcp = "weather_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: reaches a public data service", "binary: needs TempestExtremes binaries", "worker: builds a separate worker environment"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
# Keep ruff's own default rules for this server. Without a [tool.ruff] table
# here, ruff would apply the launcher's lint selection from the repository root.
