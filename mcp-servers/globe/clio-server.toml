# Written by hand: a node server's descriptor is never generated.
name = "globe"
runtime = "node"
version = "1.0.0"
lock = "package-lock.json"
entry = "bundle/server.js"
description = "Show regions, places and data footprints on an interactive 3D globe with OpenStreetMap, and find places by name (MCP Apps)"
# The wrapper's own licence; @modelcontextprotocol/server-map, which it runs, is MIT.
license = "BSD-3-Clause"
keywords = ["MCP", "globe", "map", "CesiumJS", "OpenStreetMap", "geocoding", "MCP Apps"]
