[project]
name = "spice-mcp"
version = "1.0.0"
description = "Simulate circuits with ngspice or LTspice and plot their waveforms."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "SPICE", "ngspice", "LTspice", "circuit simulation", "electronics"]
# The one runtime dependency is the upstream server, pinned exactly; uv.lock locks
# everything it brings (ltspice-mcp is GPL-3.0-or-later; see README.md).
dependencies = [
    "ltspice-mcp==0.8.0",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
spice-mcp = "spice_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spice_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
