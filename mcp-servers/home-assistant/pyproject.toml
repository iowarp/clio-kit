[project]
name = "home-assistant-mcp"
version = "1.0.0"
description = "Read sensors and history from your Home Assistant, control devices, and write automations, scripts, scenes and dashboards."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "Home Assistant", "smart home", "sensors", "automation", "IoT"]
# The one runtime dependency is the upstream server, pinned exactly; uv.lock locks
# everything it brings (ha-mcp is MIT; see README.md).
dependencies = [
    "ha-mcp==9.2.0",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
home-assistant-mcp = "home_assistant_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_assistant_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
