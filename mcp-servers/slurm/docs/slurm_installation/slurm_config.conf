# Slurm Configuration File
# Generated on June 17, 2025
# Single-node sample: replace localhost with the output of `hostname -s`.

ClusterName=local-cluster
ControlMachine=localhost
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SwitchType=switch/none
MpiDefault=none
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
ProctrackType=proctrack/pgid
ReturnToService=1
SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
MaxJobCount=1000
Waittime=0

# Node Definitions
NodeName=localhost CPUs=24 Sockets=1 CoresPerSocket=24 ThreadsPerCore=1 RealMemory=29824 State=UNKNOWN

# Partition Definitions
PartitionName=debug Nodes=localhost Default=YES MaxTime=INFINITE State=UP
PartitionName=normal Nodes=localhost Default=NO MaxTime=INFINITE State=UP
PartitionName=compute Nodes=localhost Default=NO MaxTime=INFINITE State=UP
