[project]
name = "pubchem-mcp"
version = "1.0.0"
description = "Look compounds up in PubChem by name (candidates when a name is ambiguous) and fetch their 3D structures as SDF."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]
keywords = ["MCP", "chemistry", "PubChem", "SMILES", "SDF", "compound"]
dependencies = [
    "fastmcp>=4.1.2,<5",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
pubchem-mcp = "pubchem_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubchem_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: calls the live PubChem API; skipped when it is unreachable",
]
