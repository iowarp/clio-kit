[project]
name = "geoservices-mcp"
version = "1.1.0"
description = "Fetch geospatial data where it is served: ArcGIS REST, OGC WFS and WCS, STAC, remote rasters and EPT/COPC lidar, by region"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "IoWarp Team - Gnosis Research Center", email = "grc@illinoistech.edu" }
]

keywords = ["MCP", "geospatial", "arcgis", "wfs", "wcs", "stac", "cog", "lidar", "ept", "copc"]

dependencies = [
    "fastmcp>=4.1.2,<5",
    "python-dotenv>=1.2.2",
    "numpy>=1.24.0",
    "authlib>=1.6.12",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "msgpack>=1.2.1",
    "requests>=2.33.0",
    "httpx>=0.27.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "laspy[lazrs,requests]>=2.5.0",
    "truststore>=0.9.0",
]

[project.urls]
Homepage = "https://toolkit.iowarp.ai/"
Repository = "https://github.com/iowarp/clio-kit"

[project.scripts]
geoservices-mcp = "geoservices_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoservices_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Keep ruff's own default rules for this server. Without a [tool.ruff] table
# here, ruff would apply the launcher's lint selection from the repository root.
