name: Setup MCP Server
description: Install uv, Python, and dependencies for an MCP server

inputs:
  python-version:
    description: >-
      Python version to install. Empty means the server's own pin in
      mcp-servers/<mcp>/.python-version, the interpreter the launcher uses.
    default: ""
  mcp:
    description: MCP server directory name (under mcp-servers/)
    required: true
  dev-packages:
    description: Space-separated extra dev packages to install
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: false

    - name: Resolve the Python version for ${{ inputs.mcp }}
      id: python
      shell: bash
      run: |
        version="${{ inputs.python-version }}"
        if [ -z "$version" ]; then
          pin="mcp-servers/${{ inputs.mcp }}/.python-version"
          if [ ! -f "$pin" ]; then
            echo "::error::$pin is missing and no python-version input was given"
            exit 1
          fi
          version="$(tr -d '[:space:]' < "$pin")"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # Later `uv run` steps resolve the interpreter again. Without this,
        # they follow the server's .python-version, recreate .venv on that
        # interpreter, and drop both the requested Python and dev-packages.
        echo "UV_PYTHON=$version" >> "$GITHUB_ENV"

    - name: Set up Python ${{ steps.python.outputs.version }}
      shell: bash
      run: uv python install ${{ steps.python.outputs.version }}

    - name: Install dependencies for ${{ inputs.mcp }}
      shell: bash
      run: |
        git config --global url.https://github.com/.insteadOf git@github.com:
        cd mcp-servers/${{ inputs.mcp }}
        uv sync --frozen --all-extras --dev --python "${{ steps.python.outputs.version }}"
        if [ -n "${{ inputs.dev-packages }}" ]; then
          uv pip install ${{ inputs.dev-packages }}
        fi
