name: Setup MCP Server
description: Install uv, Python, and dependencies for an MCP server

inputs:
  python-version:
    description: >-
      Python version to install. Empty means the server's own .python-version,
      which tests/test_server_python_pin.py keeps inside its requires-python.
    default: ""
  mcp:
    description: MCP server directory name (under mcp-servers/)
    required: true
  dev-packages:
    description: Space-separated extra dev packages to install
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: false

    - name: Set up Python for ${{ inputs.mcp }}
      shell: bash
      run: |
        version="${{ inputs.python-version }}"
        pin="mcp-servers/${{ inputs.mcp }}/.python-version"
        if [ -z "$version" ]; then
          if [ ! -f "$pin" ]; then
            echo "::error::${{ inputs.mcp }} has no .python-version and no python-version was given"
            exit 1
          fi
          version=$(tr -d '[:space:]' < "$pin")
        fi
        # Every later `uv run` in the job must use this interpreter. Without
        # UV_PYTHON it follows .python-version instead, rebuilding the venv on a
        # different Python and dropping the `uv pip install`ed dev packages.
        echo "UV_PYTHON=$version" >> "$GITHUB_ENV"
        uv python install "$version"

    - name: Install dependencies for ${{ inputs.mcp }}
      shell: bash
      run: |
        git config --global url.https://github.com/.insteadOf git@github.com:
        cd mcp-servers/${{ inputs.mcp }}
        # Extras declared as conflicting under [tool.uv] cannot be installed together, so
        # such a server (ase: MACE and UMA pin different e3nn) is checked without extras.
        # Its calculators build their own environment per extra at run time.
        if grep -q '^conflicts *=' pyproject.toml; then
          echo "::notice::${{ inputs.mcp }} declares conflicting extras; syncing without extras"
          uv sync --frozen --dev --python "$UV_PYTHON"
        else
          uv sync --frozen --all-extras --dev --python "$UV_PYTHON"
        fi
        if [ -n "${{ inputs.dev-packages }}" ]; then
          uv pip install ${{ inputs.dev-packages }}
        fi
