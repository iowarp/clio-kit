# Declarative doctor checks; these do not execute server code.

# `executables` are searched on PATH, then in `executable-paths`. A set
# `executable-environment` variable replaces that search, as it does in the
# server. `environment-files` variables must name an existing path.

[prerequisites.spack]
executables = ["spack"]
executable-environment = ["SPACK_MCP_COMMAND"]
executable-paths = ["$SPACK_ROOT/bin/spack", "~/.local/spack/bin/spack", "/opt/spack/bin/spack"]

[prerequisites.slurm]
executables = ["sbatch"]

[prerequisites.lmod]
executables = ["lmod"]
executable-environment = ["LMOD_CMD"]
executable-paths = ["/usr/share/lmod/lmod/libexec/lmod", "/usr/local/lmod/lmod/libexec/lmod"]

[prerequisites.scientific-catalog]
environment-files = ["SCIENTIFIC_CATALOG_FILE"]

[prerequisites.paraview]
note = "Needs ParaView 5.13 or later (pvpython) on this machine or on the SSH host in PARAVIEW_ADDRESS, or PARAVIEW_VERSION to fetch it here; the server starts without it and its first scene call says what is missing. A handshake alone is insufficient."

[prerequisites.slicer]
executable-environment = ["SLICER_BIN"]
note = "Needs PrusaSlicer or OrcaSlicer installed on this machine (on PATH, or SLICER_BIN naming it); it never downloads a slicer."

[prerequisites.pdf]
note = "Needs Node.js 20 or newer (node and npm) on this machine; the first start installs the locked server with npm."

# The address and token are configuration, not software on this machine, so they are
# checked as environment and carry no note (a note reads as "install this first").
# Earthdata's login is optional, so it has no check at all.
[prerequisites.home-assistant]
environment = ["HOMEASSISTANT_URL", "HOMEASSISTANT_TOKEN"]

[prerequisites.spice]
note = "Needs ngspice or LTspice installed on this machine; ltspice-mcp finds it and never downloads one."

[prerequisites.avogadro]
executables = ["Xvfb", "x11vnc"]
executable-environment = ["AVOGADRO_COMMAND"]
note = "Needs Avogadro 2 (the avogadro plugin's install-avogadro skill installs it; then AVOGADRO_COMMAND or avogadro2 on PATH) and, on Linux, Xvfb and x11vnc for the streamed view."

[prerequisites.fdmnes]
executable-environment = ["FDMNES_COMMAND", "FDMNES_EXE"]
note = "run_xanes needs the FDMNES executable (spack install fdmnes from clio-kit's spack-repo, then FDMNES_COMMAND or fdmnes on PATH); reading and comparing spectra need nothing."

[prerequisites.graspa]
executable-environment = ["GRASPA_COMMAND", "CHEMGRAPH_GRASPA_EXECUTABLE"]
note = "run_graspa needs gRASPA on a GPU node (spack install graspa +cuda or +rocm); prepare_graspa, read_graspa and rank_frameworks need nothing."

[prerequisites.decimer]
note = "The first image_to_smiles downloads the DECIMER model weights (about 285 MiB)."

[prerequisites.chronolog]
note = "Scientific backend requires a workflow check; a handshake alone is insufficient."

[prerequisites.darshan]
executables = ["darshan-parser"]
note = "Scientific backend requires a workflow check; a handshake alone is insufficient."

[prerequisites.jarvis]
note = "Scientific backend requires a workflow check; a handshake alone is insufficient."

# Servers that run one third-party MCP server exactly as published. Each one depends
# on the release named here, pinned exactly in its manifest (pyproject.toml or
# package.json) and locked in its lock; none of the upstream code is copied into this
# repository. The server reports the upstream's own name and version, and its tools,
# resources and MCP Apps views pass through unchanged. `license` is the upstream's,
# for the documentation; the wrapper files are BSD-3-Clause like the rest of the kit.
# `probe-environment` is what tool listing at generation needs and nothing else
# (ha-mcp refuses to start without an address and a token, but lists its tools
# without reaching them).
[upstream.earthdata]
package = "earthdata-mcp-server"
registry = "pypi"
version = "0.6.0"
license = "BSD-3-Clause"
repository = "https://github.com/datalayer/earthdata-mcp-server"

[upstream.home-assistant]
package = "ha-mcp"
registry = "pypi"
version = "9.2.0"
license = "MIT"
repository = "https://github.com/homeassistant-ai/ha-mcp"
probe-environment = { HOMEASSISTANT_URL = "http://127.0.0.1:9", HOMEASSISTANT_TOKEN = "listing-needs-no-home", HA_MCP_DISABLE_SETTINGS_UI = "1" }

[upstream.pdf]
package = "@modelcontextprotocol/server-pdf"
registry = "npm"
version = "2.0.4"
license = "MIT"
repository = "https://github.com/modelcontextprotocol/ext-apps/tree/main/examples/pdf-server"

[upstream.spice]
package = "ltspice-mcp"
registry = "pypi"
version = "0.8.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/cognitohazard/ltspice-mcp"

# Special aggregate packages; their descriptions and versions live in their
# manifests. Ordinary component folders are discovered without an entry here.
[collections.clio-skills]
category = "skills"
primary-skills = true

[collections.clio-agents]
category = "agents"
