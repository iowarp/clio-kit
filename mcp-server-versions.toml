schema-version = 1

# Publish new immutable server releases when schemas, runtime behavior or locked
# dependencies change. A dependency security update warrants a patch release even
# when the tool schema is unchanged. Never reuse an already-published version.
# All 22 servers receive stable FastMCP 4 / MCP SDK v2 runtime updates in
# the 2.11.0 candidate wheel; publish their coordinated Registry versions.
[mcp-registry-release]
publish = ["adios", "arxiv", "chronolog", "compression", "darshan", "geo", "hdf5", "jarvis", "lmod", "ndp", "node-hardware", "pandas", "parallel-sort", "paraview", "parquet", "plot", "scientific-catalog", "seismology", "slurm", "spack", "terrain", "web"]

# Generated website metadata must not depend on the wall clock. Advance this
# date intentionally whenever current contract metadata is regenerated.
[documentation]
updated = "2026-09-10"

# Workflow bundles. Each one generates a plugin whose entire content is a
# dependency list naming its member server plugins -- no server code and no
# skill text is copied, so a bundle cannot drift from what it bundles. The
# grouping is by the work someone sits down to do, not by subject area, which
# is why parallel-sort's log filtering sits with the profilers rather than
# with the file-format readers.
#
# Every name under `servers` must exist under [servers] below, and every
# server under [servers] must appear in exactly one bundle. Generation fails
# on an unknown name, a duplicate, or a server left unplaced, so a new server
# cannot quietly ship outside the catalogue.
#
# Bundle versions are their own line, independent of both the PyPI wheel and
# the per-server contract versions: re-cutting a bundle's membership is a
# bundle change, not a server change.
[bundles.clio-hpc]
version = "1.0.2"
description = "Install a code, wrap it in a pipeline, submit it, and follow it on a cluster."
servers = ["jarvis", "lmod", "node-hardware", "slurm", "spack"]

[bundles.clio-performance]
version = "1.0.3"
description = "Work out why a finished job was slower than it should have been."
servers = ["chronolog", "darshan", "parallel-sort"]

[bundles.clio-scientific-io]
version = "1.0.3"
description = "Open a scientific data file, see its structure, and read part of it."
servers = ["adios", "compression", "hdf5", "parquet"]

[bundles.clio-analysis]
version = "1.0.4"
description = "Turn a dataset into summary statistics and a figure."
servers = ["pandas", "paraview", "plot"]

[bundles.clio-geoscience]
version = "1.0.2"
description = "Inspect and map geospatial features, terrain models, and waveform archives."
servers = ["geo", "seismology", "terrain"]

[bundles.clio-research]
version = "1.0.4"
description = "Find papers on a topic and the datasets behind them."
servers = ["arxiv", "ndp", "scientific-catalog", "web"]

# Agent-facing scope of each server. Servers are "scientific" unless listed
# here, so this table records only the general-purpose exceptions. It is the
# single source for the published marketplace category and for the launcher's
# `clio-kit mcp-servers` grouping; every name must exist under [servers] below,
# so a rename or removal fails generation instead of silently misclassifying.
[classification]
general = ["compression", "web"]

# MCP Registry server versions identify contract and runtime releases. They are
# intentionally independent of the clio-kit PyPI distribution version, which
# only identifies the wheel containing the server implementations.
[servers]
adios = "2.2.5"
arxiv = "2.2.5"
chronolog = "2.0.3"
compression = "2.2.5"
darshan = "2.2.5"
geo = "2.3.1"
hdf5 = "2.2.5"
jarvis = "3.7.4"
lmod = "3.0.1"
ndp = "2.2.5"
node-hardware = "2.2.5"
pandas = "2.2.6"
parallel-sort = "2.2.5"
paraview = "2.2.5"
parquet = "2.2.5"
plot = "2.2.5"
scientific-catalog = "1.1.4"
seismology = "2.3.1"
slurm = "3.0.2"
spack = "2.3.1"
terrain = "2.2.5"
web = "2.1.3"
