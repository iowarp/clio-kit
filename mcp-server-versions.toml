# Declarative doctor checks; these do not execute server code.

# `executables` are searched on PATH, then in `executable-paths`. A set
# `executable-environment` variable replaces that search, as it does in the
# server. `environment-files` variables must name an existing path.

[prerequisites.spack]
executables = ["spack"]
executable-environment = ["SPACK_MCP_COMMAND"]
executable-paths = ["$SPACK_ROOT/bin/spack", "~/.local/spack/bin/spack", "/opt/spack/bin/spack"]

[prerequisites.slurm]
executables = ["sbatch"]

[prerequisites.lmod]
executables = ["lmod"]
executable-environment = ["LMOD_CMD"]
executable-paths = ["/usr/share/lmod/lmod/libexec/lmod", "/usr/local/lmod/lmod/libexec/lmod"]

[prerequisites.scientific-catalog]
environment-files = ["SCIENTIFIC_CATALOG_FILE"]

[prerequisites.paraview]
note = "Needs ParaView 6 (pvpython) on this machine or on the SSH host in PARAVIEW_ADDRESS; the server starts without it and its first scene call says what is missing. A handshake alone is insufficient."

[prerequisites.chronolog]
note = "Scientific backend requires a workflow check; a handshake alone is insufficient."

[prerequisites.darshan]
executables = ["darshan-parser"]
note = "Scientific backend requires a workflow check; a handshake alone is insufficient."

[prerequisites.jarvis]
note = "Scientific backend requires a workflow check; a handshake alone is insufficient."

# Special aggregate packages; their descriptions and versions live in their
# manifests. Ordinary component folders are discovered without an entry here.
[collections.clio-skills]
category = "skills"
primary-skills = true

[collections.clio-agents]
category = "agents"
