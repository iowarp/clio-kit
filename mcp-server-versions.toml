schema-version = 1

# Publish new immutable server releases when schemas, runtime behavior or locked
# dependencies change. A dependency security update warrants a patch release even
# when the tool schema is unchanged. Never reuse an already-published version.
# geo 2.4.0 adds show_on_globe: the same layers as render_feature_map on an
# interactive CesiumJS globe (an MCP Apps view, ui://geo/globe) whose picked feature
# is reported back; it adds platformdirs as a direct dependency for saved views.
# paraview 3.0.0 is a new server: a front that attaches over SSH to a node half
# in ParaView's Python and shows a live trame view (MCP Apps). 3.1.0 gives the
# view ParaView controls (pipeline, filters, display, camera, information) that
# run the tools' own commands, and follows the host's theme; its node folder
# adds trame-vuetify, so a new version folder is prepared. 3.2.0 follows a
# growing source: open_view takes a clio.view-descriptor.v1, a following view
# moves to each new step and a parked view reports newer steps, watch_steps
# reports each step as MCP task progress, and measure_over_time adds field
# statistics per step; it adds fastmcp[tasks]. 3.3.0 joins a running pvserver
# (PARAVIEW_PVSERVER, such as a relay's local port for one in a cluster job) and
# reads the data on the server's machine, runs ParaView 5.13 and Python 3.10 as
# well as 6.x, runs natively on Windows, and fetches the ParaView version a server
# needs (PARAVIEW_VERSION) from Kitware when none is installed.
# slicer 1.0.0 is a new server: it slices STL, 3MF and STEP models with the
# PrusaSlicer or OrcaSlicer already installed (never downloaded) and shows the
# toolpaths layer by layer in an MCP Apps view (ui://slicer/layers).
# 2.12.7: every Python server relocks opentelemetry-api 1.45.2 (CVE-2026-126360);
# adios and paraview also relock with adios2 >= 2.13.0.1001 so macOS installs
# from wheels, and hdf5 keeps metrics under a granted cache directory. 2.12.6 was
# tagged but never published, so its server versions are released here.
# earthdata, home-assistant, pdf and spice 1.0.0 are new servers that each run
# one pinned third-party MCP server exactly as published (see [upstream] below): pdf
# the MCP Apps PDF example (Node), earthdata, home-assistant and
# spice earthdata-mcp-server, ha-mcp and ltspice-mcp (Python). Two primary bundles are
# new, clio-electronics and clio-home; clio-geoscience and clio-research gain members.
[mcp-registry-release]
publish = ["adios", "arxiv", "ase", "avogadro", "chronolog", "compression", "darshan", "decimer", "earthdata", "fdmnes", "geo", "graspa", "hdf5", "home-assistant", "jarvis", "lmod", "ndp", "node-hardware", "pandas", "parallel-sort", "paraview", "parquet", "pdf", "plot", "pubchem", "scientific-catalog", "seismology", "slicer", "slurm", "spack", "spice", "terrain", "web"]

# Generated website metadata must not depend on the wall clock. Advance this
# date intentionally whenever current contract metadata is regenerated.
[documentation]
updated = "2026-11-08"

# Workflow bundles. Each one generates a plugin whose entire content is a
# dependency list naming its member server plugins -- no server code and no
# skill text is copied, so a bundle cannot drift from what it bundles. The
# grouping is by the work someone sits down to do, not by subject area, which
# is why parallel-sort's log filtering sits with the profilers rather than
# with the file-format readers.
#
# Every name under `servers` must exist under [servers] below, and every
# server under [servers] must appear in exactly one primary bundle. Generation fails
# on an unknown name, a duplicate, or a server left unplaced, so a new server
# cannot quietly ship outside the catalogue.
#
# Bundle versions are their own line, independent of both the PyPI wheel and
# the per-server contract versions: re-cutting a bundle's membership is a
# bundle change, not a server change.
# Optional [workflows.*] plugins may reuse components across these bundles.
# See docs/plugins.md; only [bundles.*] participates in the partition rule.
[bundles.clio-hpc]
version = "1.0.2"
description = "Install a code, wrap it in a pipeline, submit it, and follow it on a cluster."
servers = ["jarvis", "lmod", "node-hardware", "slurm", "spack"]

[bundles.clio-performance]
version = "1.0.3"
description = "Work out why a finished job was slower than it should have been."
servers = ["chronolog", "darshan", "parallel-sort"]

[bundles.clio-scientific-io]
version = "1.0.6"
description = "Open a scientific data file, see its structure, and read part of it."
servers = ["adios", "compression", "hdf5", "parquet"]

[bundles.clio-analysis]
version = "1.1.0"
description = "Turn a dataset into summary statistics, a figure, and a live 3D view."
servers = ["pandas", "paraview", "plot"]

[bundles.clio-geoscience]
version = "1.1.0"
description = "Inspect and map geospatial features, terrain, waveforms and NASA Earth-science data."
servers = ["earthdata", "geo", "seismology", "terrain"]

[bundles.clio-fabrication]
version = "1.0.0"
description = "Slice a 3D model for a printer and check it layer by layer before printing."
servers = ["slicer"]

[bundles.clio-electronics]
version = "1.0.0"
description = "Simulate a circuit with the SPICE simulator you have and plot its waveforms."
servers = ["spice"]

[bundles.clio-home]
version = "1.0.0"
description = "Read your home's sensors and their history, control devices, and write automations."
servers = ["home-assistant"]

[bundles.clio-chemistry]
version = "1.0.0"
description = "Find a compound, build and change its structure, compute energies and spectra, and simulate adsorption."
servers = ["ase", "avogadro", "decimer", "fdmnes", "graspa", "pubchem"]

[bundles.clio-research]
version = "1.1.0"
description = "Find papers on a topic, read them in a PDF viewer, and find the datasets behind them."
servers = ["arxiv", "ndp", "pdf", "scientific-catalog", "web"]

# Optional task plugins. Definitions use version, description and dependencies
# (existing maintained plugin names), not a second server ownership list.
# Task workflows and their verification limits are documented in docs/plugins.md.
[workflows]

# Agent-facing scope of each server. Servers are "scientific" unless listed
# here, so this table records only the general-purpose exceptions. It is the
# single source for the published marketplace category and for the launcher's
# `clio-kit mcp-servers` grouping; every name must exist under [servers] below,
# so a rename or removal fails generation instead of silently misclassifying.
[classification]
general = ["compression", "home-assistant", "web"]

